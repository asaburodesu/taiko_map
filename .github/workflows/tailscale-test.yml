
name: Tailscale Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check Tailscale connection
        run: tailscale status

      - name: Use Raspberry Pi as exit node
        env:
          PI_IP: ${{ vars.PI_TAILSCALE_IP }}
        run: |
          test -n "$PI_IP"
          sudo tailscale set --exit-node="$PI_IP"

      - name: Check public IP
        run: |
          curl -4fsS --max-time 15 https://api.ipify.org
          echo
